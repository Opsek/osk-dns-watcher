# osk-dns-watcher as a Compose service. Its config, expectations, webhook URL and
# history live in the volume "data", which updates keep. start.sh sets it up.
name: osk-dns-watcher

x-osk-dns-watcher: &osk-dns-watcher
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    # The version of the release that start.sh checked.
    args:
      VERSION: ${OSK_VERSION:-0.0.0-dev}
  volumes:
    - data:/data

services:
  watcher:
    <<: *osk-dns-watcher
    restart: unless-stopped
  init:
    <<: *osk-dns-watcher
    profiles: [setup]
    command: [init, --config, /data/config.json]

volumes:
  data:
