# The DNS lab. Start it with dev/lab/bin/lab, which sets LAB_ID, LAB_IMAGE and LAB_SRC.

x-labels: &labels
  osk.lab: "${LAB_ID}"

x-host: &host
  image: ${LAB_IMAGE}
  init: true
  labels: *labels
  environment:
    LAB_ID: "${LAB_ID}"
  volumes:
    - lab:/lab
  depends_on:
    init:
      condition: service_completed_successfully

x-named: &named
  <<: *host
  command: ["named", "-g", "-c", "/etc/osklab/named.conf"]

x-unbound: &unbound
  <<: *host
  command: ["unbound", "-d", "-c", "/etc/osklab/unbound.conf"]

services:
  init:
    image: ${LAB_IMAGE}
    labels: *labels
    environment:
      LAB_ID: "${LAB_ID}"
    volumes:
      - lab:/lab
    network_mode: none
    command: ["lab-init"]

  root:
    <<: *named
    working_dir: /lab/root
    networks: {lab: {ipv4_address: "10.53.${LAB_ID}.2"}}

  tld:
    <<: *named
    working_dir: /lab/tld
    networks: {lab: {ipv4_address: "10.53.${LAB_ID}.3"}}

  ns1:
    <<: *named
    working_dir: /lab/ns1
    networks: {lab: {ipv4_address: "10.53.${LAB_ID}.11"}}

  ns2:
    <<: *named
    working_dir: /lab/ns2
    networks: {lab: {ipv4_address: "10.53.${LAB_ID}.12"}}

  resolver:
    <<: *unbound
    networks: {lab: {ipv4_address: "10.53.${LAB_ID}.20"}}

  liar:
    <<: *unbound
    command: ["unbound", "-d", "-c", "/etc/osklab/liar.conf"]
    networks: {lab: {ipv4_address: "10.53.${LAB_ID}.21"}}

  # The alias lets other containers on the lab network, such as osk-dns-watcher started
  # by Compose, find hooks.lab.test through Docker's DNS.
  receiver:
    <<: *host
    command: ["receiver"]
    networks:
      lab:
        ipv4_address: "10.53.${LAB_ID}.30"
        aliases: [hooks.lab.test, mta-sts.corp.test]

  runner:
    <<: *host
    volumes:
      - lab:/lab
      - ${LAB_SRC}:/src:ro
    working_dir: /src
    extra_hosts:
      - "hooks.lab.test:10.53.${LAB_ID}.30"
      - "mta-sts.corp.test:10.53.${LAB_ID}.30"
    command:
      - sh
      - -c
      - >-
        cp /lab/ca.pem /usr/local/share/ca-certificates/osklab.crt &&
        update-ca-certificates 2> /dev/null &&
        touch /run/lab-trusted &&
        exec sleep infinity
    networks: {lab: {ipv4_address: "10.53.${LAB_ID}.100"}}

networks:
  lab:
    internal: true
    labels: *labels
    ipam:
      config:
        - subnet: "10.53.${LAB_ID}.0/24"

volumes:
  lab:
    labels: *labels
