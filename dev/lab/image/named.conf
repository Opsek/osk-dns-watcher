// BIND configuration of the authoritative servers root, tld, ns1 and ns2.
// named starts in /lab/<host>. It has no zone at start: labctl adds and
// removes every zone at run time with rndc addzone and delzone.

include "/lab/xfr.key";
include "/lab/ctl.key";

options {
	listen-on { any; };
	listen-on-v6 { none; };
	recursion no;
	dnssec-validation no;
	notify no;
	allow-new-zones yes;
	allow-transfer { key xfr-key; };
	pid-file none;
	session-keyfile none;

	// Answer ANY with one record set, as large DNS providers do, so that no
	// test comes to depend on full ANY answers.
	minimal-any yes;

	// Tests put zones into broken states on purpose, with labctl set as well
	// as with load-zone: serve them instead of refusing them.
	check-names primary ignore;
	check-integrity no;
	check-mx ignore;
	check-mx-cname ignore;
	check-srv-cname ignore;
	check-sibling no;
	check-wildcard no;
	check-dup-records ignore;
	check-spf ignore;
	check-svcb no;
};

controls {
	inet * port 953 allow { any; } keys { ctl-key; };
};
