# Unbound configuration of the resolver: recursive from the lab root, no DNSSEC validation.
server:
	interface: 0.0.0.0
	do-ip6: no
	access-control: 0.0.0.0/0 allow
	username: ""
	chroot: ""
	pidfile: ""
	use-syslog: no
	num-threads: 1
	root-hints: "/lab/root.hints"
	module-config: "iterator"
	# Unbound answers test. itself by default (RFC 6761); the lab needs the real zone.
	local-zone: "test." nodefault

remote-control:
	control-enable: yes
	control-interface: 0.0.0.0
	server-key-file: "/lab/unbound/unbound_server.key"
	server-cert-file: "/lab/unbound/unbound_server.pem"
	control-key-file: "/lab/unbound/unbound_control.key"
	control-cert-file: "/lab/unbound/unbound_control.pem"
